# Builds the menu-bar app and runs its unit tests on every push / PR.
#
# Runs on a SELF-HOSTED macOS runner. Two reasons, one measured and one not:
#
#   - Measured 2026-09-15: GitHub-hosted jobs on this account are refused before
#     they start. macos-latest/26/15 each failed in ~6s with zero steps and the
#     annotation "The job was not started because recent account payments have
#     failed or your spending limit needs to be increased." A self-hosted job in
#     the same repo queues normally, so the block is on hosted minutes only.
#   - Unverified: the project is saved in Xcode 27 format (objectVersion 110),
#     which hosted images were believed unable to open. That claim predates
#     Xcode 27 shipping and could not be re-tested, because the billing block
#     stops any hosted job from running. Do not cite it as fact.
#
# Either way the runner must be a Mac running macOS 27 with Xcode 27 selected
# (xcode-select), not merely one with Xcode 27 installed: every configuration
# sets MACOSX_DEPLOYMENT_TARGET = 27.0 and `xcodebuild test` launches the app as
# its own test host, so the tests need macOS 27 at RUNTIME.
#
# The runner lives at ~/Tools/actions-runner on Daniel's MacBook Pro, registered
# as Daniels-MacBook-Pro-xcode27 and kept alive by the LaunchAgent that
# `svc.sh install` wrote to ~/Library/LaunchAgents. Re-register with a fresh
# token from `gh api -X POST repos/<owner>/<repo>/actions/runners/registration-token`.
#
# Why a real `xcodebuild test` and not just `swiftc -typecheck`:
#   - A prior type-check-only CI passed while the app failed to BUILD (a missing
#     `import Combine` for ObservableObject/@Published compiled under -typecheck
#     but not under a full module build). Only a real build catches that class of
#     error, so CI builds the app + test bundle for real.
#
# The shared "claude spinner" scheme runs only claude_spinnerTests and skips
# claude_spinnerUITests (XCUITest can't launch a menu-bar/agent app).
#
# Path-filtered to Swift/Xcode sources only. Changes that don't touch the app
# (docs, the bash reset-notifier, other tooling) must not queue this job: the
# self-hosted macOS runner is a scarce, sometimes-offline resource, and a job
# with no available runner sits in the queue until GitHub cancels it at the 24h
# await-runner limit — surfacing as a red check on unrelated PRs.
#
# Deliberately NOT triggered by edits to this workflow file: doing so would make
# every CI-config change (like a docs/tooling PR that also touches CI) queue on
# the offline-prone Mac runner and fail. Workflow changes ride along with the
# next real Swift change instead.

name: Swift

on:
  push:
    branches: [ "main" ]
    paths:
      - "claude spinner/**"
      - "claude spinner.xcodeproj/**"
      - "claude spinnerTests/**"
      - "claude spinnerUITests/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "claude spinner/**"
      - "claude spinner.xcodeproj/**"
      - "claude spinnerTests/**"
      - "claude spinnerUITests/**"

jobs:
  test:
    runs-on: [self-hosted, macOS]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run unit tests
        run: |
          set -o pipefail
          # The unit tests are hosted in the app; its single-instance guard
          # exit(0)s a second copy, which would kill the test host if a normal
          # copy is already running on this machine. Quit it first.
          killall "claude spinner" 2>/dev/null || true
          xcodebuild test \
            -project "claude spinner.xcodeproj" \
            -scheme "claude spinner" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
