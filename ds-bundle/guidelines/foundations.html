<!-- @dsCard group="Foundations" name="Palette and type" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
  .sw{border:1px solid var(--cs-separator);border-radius:var(--cs-radius-control);overflow:hidden}
  .sw i{display:block;height:36px}
  .sw span{display:block;padding:4px 6px}
  h2{font:600 var(--cs-size-ui) var(--cs-font-ui);margin:16px 0 8px}
</style></head>
<body>
<h2>Brand and state</h2>
<div class="grid" id="brand"></div>
<h2>Usage heat</h2>
<div class="grid" id="heat"></div>
<h2>Session identity</h2>
<div class="grid" id="id"></div>
<h2>Type</h2>
<div style="font:600 var(--cs-size-title) var(--cs-font-mono)">claude-spinner</div>
<div class="cs-mono"><span class="cs-label">model </span><span class="cs-value">opus 5.5</span></div>
<div class="cs-mono"><span class="cs-label">ctx </span><span class="cs-value">142k / 200k</span></div>
<div style="font-size:var(--cs-size-micro);font-family:var(--cs-font-mono)" class="cs-muted">updated 12s ago</div>
<p style="margin:8px 0 0">AppKit chrome text, 13px system font.</p>
<div style="margin-top:8px"><span class="cs-chip" style="color:var(--cs-id-purple);background:color-mix(in srgb,var(--cs-id-purple) 16%,transparent)">ghostty</span></div>
<script>
const groups={brand:["accent","label","attention","text-secondary"],heat:["heat-1","heat-2","heat-3","heat-4"],id:["id-purple","id-cyan","id-jade","id-indigo"]};
for(const [g,names] of Object.entries(groups))for(const n of names){
  const d=document.createElement("div");d.className="sw";
  d.innerHTML=`<i style="background:var(--cs-${n})"></i><span class="cs-mono">--cs-${n}</span>`;
  document.getElementById(g).appendChild(d);}
</script>
</body></html>
